# Prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# New window
unbind '"'
unbind %
bind '"' split-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Easy Config Reloads
bind r source-file ~/.tmux.conf

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# and fzf integration https://blog.bugsnag.com/tmux-and-vim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                 tmux select-pane -L"

bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
                 ($is_fzf && tmux send-keys C-j) || \
                 tmux select-pane -D"

bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                 ($is_fzf && tmux send-keys C-k)  || \
                 tmux select-pane -U"

bind -n C-l run "($is_vim && tmux send-keys C-l) || \
                 tmux select-pane -R"

bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

#mouse mode for panes
set -g mouse on

#misc
set -g set-titles on
set -s escape-time 0
set-option -g history-limit 250000

# Stop with the annoying questions
bind-key x kill-pane
bind-key & kill-window

# Theme
# ══════════════════════════════════════════════════════════════
# Palette — change these five values to retheme everything.
#
#   @accent  standout colour  (active segments, borders, clock)
#   @mid     medium grey      (secondary segments)
#   @dim     dark grey        (tertiary segments)
#   @bg      bar background   (near-black)
#   @text    default text     (on dark backgrounds)
#
# #{@varname} in format strings requires tmux ≥ 3.0.
# Glyphs (U+E0B0 , U+E0B2 ) require a Nerd Font / powerline font.
# ══════════════════════════════════════════════════════════════
set -g @accent "colour39"   # cyan
set -g @mid    "colour240"  # mid grey
set -g @dim    "colour235"  # dark grey
set -g @bg     "colour233"  # near-black
set -g @text   "colour252"  # light grey

set -g status-style "fg=colour252,bg=colour233"
set -g status-interval 5

# Left bar: [^ if prefix active]  [session]  [ git branch]  [win:pane]
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[fg=colour233,bg=colour196,bold] ^ #[fg=colour196,bg=#{@accent}],#[fg=#{@accent},bg=#{@bg}]}#[fg=#{@bg},bg=#{@accent},nobold] #S #[fg=#{@accent},bg=#{@mid}]#[fg=#{@text},bg=#{@mid}]  #(cd #{pane_current_path} && git symbolic-ref --short HEAD 2>/dev/null | head -1) #[fg=#{@mid},bg=#{@dim}]#[fg=#{@text},bg=#{@dim}] #I:#P #[fg=#{@dim},bg=#{@bg}]"

# Right bar: [Z if pane zoomed]  [battery%]  [time]  [date]  [hostname]
# Remove the battery segment if not on macOS (pmset not available).
set -g status-right-length 80
set -g status-right "#{?window_zoomed_flag,#[fg=#{@text}] [Z] ,}#[fg=#{@dim},bg=#{@bg}]#[fg=#{@text},bg=#{@dim}] #(pmset -g binfo 2>/dev/null | awk '/InternalBattery/{match($0,/[0-9]+%%/); if(RSTART) print substr($0,RSTART,RLENGTH-1)}')%%  %H:%M:%S #[fg=#{@mid},bg=#{@dim}]#[fg=#{@text},bg=#{@mid}] %d %b #[fg=#{@accent},bg=#{@mid}]#[fg=#{@bg},bg=#{@accent},bold] #H "

# Windows (centred): inactive keeps neutral; active gets accent treatment
set -g window-status-format "  #I:#W#F  "
set -g window-status-current-format "#[fg=#{@accent},bg=#{@bg}]#[fg=#{@bg},bg=#{@accent},bold] #I:#W #[fg=#{@accent},bg=#{@bg},nobold]"
set -g window-status-current-style "default"
set -g window-status-activity-style "fg=colour233,bg=colour245"
set -g window-status-separator ""

# Window status alignment
set -g status-justify centre

# Pane borders
set -g pane-border-style "fg=colour235"           # @dim
set -g pane-active-border-style "fg=colour39"     # @accent

# Pane number display (prefix + q), clock (prefix + t), messages
set -g display-panes-colour colour235             # @dim
set -g display-panes-active-colour colour39       # @accent
set -g clock-mode-colour colour39                 # @accent
set -g clock-mode-style 24
set -g message-style "fg=colour233,bg=colour39"
set -g message-command-style "fg=colour252,bg=colour235"
set -g mode-style "fg=colour233,bg=colour39"

